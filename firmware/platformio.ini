; HX2 firmware (RP2040, earlephilhower Arduino-Pico core)
;   pio run -t upload        (hold BOOTSEL while plugging in the first time)
;   pio device monitor

[env:rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; Raspberry Pi Pico. For a Waveshare RP2040-Zero use: board = waveshare_rp2040_zero
board = pico
board_build.core = earlephilhower
framework = arduino
monitor_speed = 115200
; newlib-nano drops float support from printf/snprintf unless asked for it
; (otherwise %f prints nothing, on serial and on the OLED)
build_flags = -Wl,-u,_printf_float
lib_deps =
    olikraus/U8g2@^2.35.9
